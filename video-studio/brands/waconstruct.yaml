# WA Construct, from the Blog & Creative Context v1.0 (2026-10-19), which overrides the brand guide:
#   - Roboto only; max 2 colours per asset plus the logo's own gold; text left-aligned
#   - logo used as-is with NO box or bar behind it; the white-converted logo only on navy panels,
#     bottom-left, aligned with the text. So cards are navy + white with the white logo, and there is
#     no corner logo over footage (a bare logo on busy footage isn't an approved use)
#   - on-screen captions in block letters
#   - no pricing, no HomeEstimator.ai, waconstruct.com, 201-485-8887
name: WA Construct
font: Roboto
font_weights: { headline: bold, sub: light, small: regular }
card_layout: left
logo: assets/waconstruct-logo.png
card_logo: assets/waconstruct-logo-white.png # navy cards only
colors:
  bg: "#3e4d6b" # Blue (primary)
  accent: "#b7964e" # Gold (secondary)
  secondary: "#ffffff"
  text: "#ffffff"
captions:
  font: Roboto
  color: "#ffffff"
  active_color: "#b7964e"
  outline_color: "#000000"
  uppercase: true # block letters
  size_vertical: 0.042
  size_landscape: 0.050
  margin_vertical: 0.22
  margin_landscape: 0.07
  words_vertical: 3
  words_landscape: 6
fill:
  landscape: crop
  vertical: blur # jobsite footage: blurred fill instead of bars
  square: blur
watermark: {} # no corner logo: it may not sit bare on footage or in a box
trim:
  mode: speech # set to "none" for b-roll with no talking
  silence_max: 0.8
  gap: 0.5
  fillers: true
  stutters: true
intro:
  seconds: 3.0
outro:
  seconds: 4.0
  cta: "Tell us about your project"
  sub: "waconstruct.com"
music:
  under: all # a low bed under the whole video
  bed_db: -24
lufs: -14
