# WA Construct, from the brand guide (project knowledge: WA_Construct_Brand_Guide.md).
# Rules that shape this file:
#   - max 2 colours per asset: Blue ground + Gold accent, white type
#   - the logo is black and is never recoloured or placed straight on footage or colour:
#     it always sits in a solid White box with a safe area of 3x the height of "CONSTRUCT"
#   - Univers LT Std isn't licensed here, so Roboto (the guide's fallback): Medium headlines,
#     Light subheads, Regular body (fonts vendored in brands/assets/fonts, installed by setup.sh)
#   - no pricing, ever; phone is 201-485-8887; URL is waconstruct.com
name: WA Construct
font: Roboto
font_weights: {headline: medium, sub: light, small: regular}
logo: assets/waconstruct-logo.png
logo_container:
  color: "#ffffff"
  safe_area: 3.0
  word_height: 0.166     # "CONSTRUCT" is 32 px of the 193 px trimmed logo
colors:
  bg: "#3e4d6b"          # Blue (primary)
  accent: "#b7964e"      # Gold (secondary)
  secondary: "#b7964e"   # sub lines in Gold too, to stay within two colours
  text: "#ffffff"
captions:
  font: Roboto
  color: "#ffffff"
  active_color: "#b7964e"
  outline_color: "#000000"
  uppercase: false
  size_vertical: 0.042
  size_landscape: 0.050
  margin_vertical: 0.22
  margin_landscape: 0.07
  words_vertical: 3
  words_landscape: 6
fill:
  landscape: crop
  vertical: blur           # jobsite footage: blurred fill instead of bars
  square: blur
watermark:
  all: true
  position: top-right
  opacity: 1.0             # no transparency or effects on the mark
  width_landscape: 0.15    # the whole white box, as a fraction of frame width
  width_vertical: 0.32
  max_height: 0.15
trim:
  mode: speech             # set to "none" for b-roll with no talking
  silence_max: 0.8
  gap: 0.5
  fillers: true
  stutters: true
intro:
  seconds: 3.0
outro:
  seconds: 4.0
  cta: "Schedule your consultation"
  sub: "waconstruct.com  |  201-485-8887"
music:
  under: all               # a low bed under the whole video
  bed_db: -24
lufs: -14
